<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12211d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nakit Akışı">
<title>Nakit Akışı Çarşaf</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#12211d;
    --paper-raised:#17281f;
    --line:#25392e;
    --line-strong:#33493c;
    --ink:#e9e5d6;
    --ink-dim:#9db0a5;
    --ink-faint:#5f7268;
    --gold:#c9a24d;
    --gold-dim:#8a733a;
    --gelir:#4fb286;
    --gelir-bg:#16261f;
    --gider:#c1553f;
    --gider-bg:#241c19;
    --kredi-bg:#22201c;
    --filled:#1e3d2c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%; overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  #app{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding-bottom:40px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  header{padding:18px 14px 6px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-dim); margin:0 0 4px;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin:0 0 4px; letter-spacing:-.01em;}
  .hint{font-size:11.5px; color:var(--ink-faint); margin:0; line-height:1.5;}
  .explain-box{
    margin-top:12px; padding:12px 14px; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
  }
  .explain-box p{font-size:12px; line-height:1.55; color:var(--ink-dim); margin:0 0 10px;}
  .explain-box p:last-child{margin-bottom:0;}

  .year-bar{display:flex; align-items:center; gap:8px; padding:12px 14px 6px;}
  .year-scroll{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1;}
  .year-scroll::-webkit-scrollbar{display:none;}
  .year-chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer;
  }
  .year-chip.active{background:var(--gold); border-color:var(--gold); color:#12211d;}
  .year-add{
    flex:none; width:36px; height:36px; border-radius:50%; border:1px dashed var(--gold-dim); background:transparent;
    color:var(--gold); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  .dash-btn-row{padding:6px 14px 10px;}
  .dash-btn{
    width:100%; padding:13px; border-radius:11px; border:1px solid var(--gold);
    background:linear-gradient(135deg, rgba(201,162,77,0.16), rgba(201,162,77,0.05));
    color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700; letter-spacing:.03em;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .back-btn{
    background:none; border:1px solid var(--line-strong); color:var(--ink-dim); border-radius:9px;
    padding:9px 14px; font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer; margin:0 14px 12px;
  }

  .topbar{display:flex; gap:10px; padding:8px 14px 14px; flex-wrap:wrap;}
  .topfield{flex:1; min-width:140px; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:8px 12px;}
  .topfield label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:3px;}
  .topfield input, .topfield select{width:100%; background:transparent; border:none; color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; padding:0;}
  .topfield input:focus, .topfield select:focus{outline:none;}
  .topfield select{-webkit-appearance:none; appearance:none;}
  .topfield select option{background:var(--paper-raised); color:var(--ink);}

  .install-note{
    margin:0 14px 12px; padding:10px 12px; background:rgba(201,162,77,0.08);
    border:1px solid var(--gold-dim); border-radius:10px; font-size:11.5px; color:var(--ink-dim); line-height:1.55;
  }
  .install-note b{color:var(--gold);}
  .install-note button{
    margin-top:8px; background:var(--gold); color:#12211d; border:none; border-radius:7px;
    padding:7px 12px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; cursor:pointer;
  }

  .backup-bar{display:flex; gap:8px; padding:0 14px 12px; flex-wrap:wrap;}
  .backup-btn{
    flex:1; min-width:100px; padding:10px 8px; border-radius:9px; border:1px solid var(--gold-dim); background:transparent;
    color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; cursor:pointer;
    text-align:center;
  }
  .backup-btn.primary{background:var(--gold); color:#12211d; border-color:var(--gold);}
  .backup-btn:active{background:rgba(201,162,77,0.1);}
  #importFile{display:none;}

  .swipe-note{
    display:flex; align-items:center; gap:6px; margin:0 14px 10px; padding:8px 12px;
    background:rgba(201,162,77,0.08); border:1px dashed var(--gold-dim); border-radius:9px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold-dim);
  }

  .entry-btn{font-size:14.5px; padding:15px;}

  .month-screen-header{
    display:flex; align-items:center; gap:8px; padding:12px 14px; flex-wrap:wrap;
    position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:1px solid var(--line-strong);
  }
  .month-nav{display:flex; align-items:center; gap:6px; flex:1; min-width:160px;}
  .month-nav select{
    flex:1; background:var(--paper-raised); border:1px solid var(--line); border-radius:9px; padding:10px 8px;
    color:var(--gold); font-family:'Fraunces',serif; font-size:15px; font-weight:700; text-align:center;
  }
  .month-nav select option{background:var(--paper-raised); color:var(--ink);}
  .month-nav-btn{
    flex:none; width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--paper-raised);
    color:var(--gold); font-size:18px; cursor:pointer;
  }
  .month-nav-btn:disabled{opacity:0.3;}

  .grid-wrap.large-mode{max-height:none;}
  .large-mode .sticky-col-inner{gap:4px;}
  .large-mode .cat-input{width:118px; font-size:14.5px; padding:12px 4px 12px 12px;}
  .large-mode .del-btn-inline{font-size:14px; padding:5px 8px;}
  .large-mode .budget-cell .cell-input.budget{width:58px; padding:13px 2px 13px 4px;}
  .large-mode .sync-check{width:17px; height:17px; margin-right:6px;}
  .large-mode .cell-input{width:70px; font-size:14px; padding:13px 6px;}
  .large-mode .fark-cell{width:70px; font-size:14px; padding:13px 8px;}
  .large-mode thead th{font-size:12px; padding:10px 6px;}
  .large-mode thead tr.sub-header th{font-size:11px; padding:8px 4px;}
  .large-mode .readonly-cell{font-size:14px; padding:13px 10px;}
  .large-mode .subsection-row td{font-size:12px; padding:9px 12px 9px 20px;}
  .large-mode .section-row td{font-size:12.5px; padding:10px 12px;}
  .large-mode .add-row td{padding:8px 12px 8px 20px;}
  .large-mode .add-btn{font-size:12.5px; padding:8px 14px;}

  .grid-wrap{overflow-x:auto; overflow-y:auto; max-height:55vh; padding:0 0 4px; -webkit-overflow-scrolling:touch; border-bottom:1px solid var(--line-strong);}
  table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%;}

  th, td{border-bottom:1px solid var(--line); padding:0; white-space:nowrap;}

  thead th{
    position:sticky; top:0; z-index:3;
    background:#1e3327; color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em;
    font-weight:600; padding:6px 4px; text-align:center; border-bottom:1px solid var(--line-strong);
  }
  thead tr.month-header th{font-size:10px; padding:7px 4px; border-right:1px solid var(--line-strong);}
  tbody tr{scroll-margin-top:88px;}
  .cell-input, .cat-input{scroll-margin-top:88px;}
  thead tr.sub-header th{font-size:8.5px; padding:5px 2px; color:var(--ink-faint); font-weight:600;}
  thead tr.sub-header th.b-col{color:var(--gold-dim);}
  thead tr.sub-header th.g-col{color:var(--ink-dim);}
  thead tr.sub-header th.f-col{color:var(--ink-faint); border-right:1px solid var(--line-strong);}
  thead th.sticky-col{position:sticky; left:0; top:0; z-index:4; text-align:left; padding-left:12px;}

  td.sticky-col, th.sticky-col{border-right:2px solid var(--gold-dim);}
  td.sticky-col{position:sticky; left:0; z-index:2; background:var(--paper-raised);}
  tr.gelir-row td.sticky-col{background:var(--gelir-bg);}
  tr.gider-row td.sticky-col{background:var(--gider-bg);}
  tr.gelir-row td{background:var(--gelir-bg);}
  tr.gider-row td{background:var(--gider-bg);}
  tr.gider-row.group-kredi td.sticky-col{background:var(--kredi-bg);}
  tr.gider-row.group-kredi td{background:var(--kredi-bg);}
  tr.gelir-row.group-kredi td.sticky-col{background:var(--kredi-bg);}
  tr.gelir-row.group-kredi td{background:var(--kredi-bg);}

  td.cell-filled{background:var(--filled) !important;}

  .sticky-col-inner{display:flex; align-items:center; gap:2px;}
  .cat-input{
    width:96px; border:none; background:transparent; color:var(--ink); font-size:12.5px; font-weight:600;
    padding:9px 4px 9px 12px; font-family:'Inter',sans-serif;
  }
  .cat-input:focus{outline:none; color:var(--gold);}
  .del-btn-inline{
    flex:none; background:none; border:1px solid var(--line-strong); border-radius:6px; color:var(--ink-faint);
    font-size:12px; cursor:pointer; padding:3px 6px; margin-right:6px;
  }
  .del-btn-inline:active{color:#fff; background:var(--gider); border-color:var(--gider);}

  @keyframes rowPulse{
    0%{ box-shadow: inset 0 0 0 2px var(--gold); }
    50%{ box-shadow: inset 0 0 0 2px transparent; }
    100%{ box-shadow: inset 0 0 0 2px var(--gold); }
  }
  tr.row-highlight td{ animation: rowPulse 0.7s ease-in-out 3; }
  tr.row-highlight td.sticky-col{ animation: rowPulse 0.7s ease-in-out 3; }

  .cell-input{
    width:52px; border:none; background:transparent; color:var(--ink); font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; text-align:right; padding:8px 4px; border-right:1px solid var(--line);
  }
  .cell-input:focus{outline:none; background:rgba(201,162,77,0.14);}
  .cell-input.budget{color:var(--gold);}
  .cell-input.actual{color:var(--ink);}

  .budget-cell{padding:0 !important; border-right:1px solid var(--line);}
  .budget-cell-inner{display:flex; align-items:center;}
  .budget-cell .cell-input.budget{width:42px; border-right:none; padding:8px 2px 8px 4px;}
  .sync-check{
    width:13px; height:13px; margin:0 4px 0 0; flex:none; accent-color:var(--gold); cursor:pointer;
  }

  .fark-cell{
    width:52px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-align:right; padding:8px 5px;
    font-weight:600; border-right:1px solid var(--line-strong);
  }
  .fark-cell.pos{color:var(--gelir);}
  .fark-cell.neg{color:var(--gider);}

  .readonly-cell{
    width:80px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-align:right; padding:9px 8px;
    font-weight:600;
  }
  .readonly-cell.gelir-c{color:var(--gelir);}
  .readonly-cell.gider-c{color:var(--gider);}
  .readonly-cell.pos{color:var(--gelir);}
  .readonly-cell.neg{color:var(--gider);}

  tr.section-row td{
    background:#1e3327; color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.08em; font-weight:700; padding:8px 12px; border-bottom:1px solid var(--line-strong);
  }
  tr.section-row td.sticky-col{background:#1e3327;}

  tr.subsection-row td{
    background:#1b2b22; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.06em; font-weight:700; padding:7px 12px 7px 20px; border-bottom:1px solid var(--line);
  }
  tr.subsection-row td.sticky-col{background:#1b2b22;}
  tr.subsection-row.kredi td{color:#c9b27a;}

  tr.add-row td{padding:6px 12px 6px 20px; background:var(--paper);}
  tr.add-row td.sticky-col{background:var(--paper);}
  .add-btn{
    background:none; border:1px dashed var(--gold-dim); color:var(--gold-dim); font-family:'IBM Plex Mono',monospace;
    font-size:11px; padding:6px 12px; border-radius:7px; cursor:pointer;
  }

  tr.subtotal-row td{background:#1e2f26; font-weight:700; padding:8px 4px; border-top:1px solid var(--line);}
  tr.subtotal-row td.sticky-col{background:#1e2f26; padding-left:20px; color:var(--ink-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; font-family:'IBM Plex Mono',monospace;}
  tr.subtotal-row .fark-cell, tr.subtotal-row .readonly-cell{font-size:10.5px;}

  tr.total-row td{background:#20362a; font-weight:700; padding:8px 4px; border-top:1px solid var(--line-strong);}
  tr.total-row td.sticky-col{background:#20362a; padding-left:12px; color:var(--ink); font-size:11px; text-transform:uppercase; letter-spacing:.02em; font-family:'IBM Plex Mono',monospace;}
  tr.total-row .fark-cell, tr.total-row .readonly-cell{font-size:10.5px;}

  tr.net-row td{background:var(--gold); padding:9px 4px;}
  tr.net-row td.sticky-col{background:var(--gold); color:#12211d; padding-left:12px; font-family:'Fraunces',serif; font-weight:700; font-size:12px;}
  tr.net-row .fark-cell, tr.net-row .readonly-cell{color:#12211d; font-size:10.5px;}

  tr.devir-row td{background:#0d1815; padding:10px 4px; border-top:2px solid var(--gold);}
  tr.devir-row td.sticky-col{background:#0d1815; color:var(--gold); padding-left:12px; font-family:'Fraunces',serif; font-weight:700; font-size:12px;}
  tr.devir-row .readonly-cell{color:var(--gold); font-size:11px; font-weight:700;}

  tr.blend-row td{background:linear-gradient(135deg,#2a4a37,#1c3327); padding:12px 6px; border-top:2px solid var(--gelir); border-bottom:2px solid var(--gelir);}
  tr.blend-row td.sticky-col{
    background:linear-gradient(135deg,#2a4a37,#1c3327); color:#fff; padding-left:12px;
    font-family:'Fraunces',serif; font-weight:700; font-size:13px; line-height:1.35;
  }
  .blend-sub{font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:400; color:var(--ink-dim); text-transform:none; letter-spacing:0;}
  .blend-cell{color:var(--gelir); font-size:13px; font-weight:800;}
  .blend-cell.blend-future{color:#cfe8da;}
  .blend-tag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:7.5px; font-weight:600; letter-spacing:.03em;
    color:#12211d; background:var(--gold); border-radius:4px; padding:1px 4px; margin-left:3px; vertical-align:middle; text-transform:uppercase;
  }

  .sheet-cell{
    width:64px; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:right; padding:9px 8px;
    border-right:1px solid var(--line);
  }
  .sheet-cell.sheet-future{ color:var(--ink-faint); font-style:italic; }

  .summary-cards{display:flex; gap:10px; padding:16px 14px 4px; overflow-x:auto;}
  .card-section-label{
    margin:14px 14px 0; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.08em; color:var(--gold-dim);
  }
  .cash-picker-card{
    margin:14px 14px 4px; padding:14px; border-radius:12px;
    background:linear-gradient(135deg,#2a4a37,#1c3327); border:1px solid var(--gelir);
  }
  .cash-picker-row{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
  .cash-picker-row label{font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
  .cash-picker-row select{
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600;
  }
  .cash-picker-row select option{background:var(--paper-raised); color:var(--ink);}
  .cash-picker-result{display:flex; justify-content:space-between; align-items:center;}
  .cash-picker-result span{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-dim);}
  .cash-picker-result b{font-family:'IBM Plex Mono',monospace; font-size:17px;}
  .cash-picker-result b.pos{color:var(--gelir);} .cash-picker-result b.neg{color:var(--gider);}

  .scard{flex:none; min-width:130px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .scard-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:6px;}
  .scard-val{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:700;}
  .scard-val.pos{color:var(--gelir);} .scard-val.neg{color:var(--gider);} .scard-val.gold{color:var(--gold);}

  .loading{text-align:center; padding:60px 20px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:12px;}

  /* Dashboard */
  .dash-section{padding:6px 14px 4px;}
  .dash-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  .dash-card h3{font-family:'Fraunces',serif; font-size:15px; margin:0 0 12px; color:var(--gold); font-weight:600;}
  .range-row{display:flex; gap:10px; margin-bottom:14px;}
  .range-field{flex:1; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:8px 10px;}
  .range-field label{display:block; font-size:9.5px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px; letter-spacing:.05em;}
  .range-field select{width:100%; background:transparent; border:none; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600;}
  .range-field select option{background:var(--paper-raised); color:var(--ink);}

  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .dash-mini{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:11px 13px;}
  .dash-mini-label{font-size:9.5px; text-transform:uppercase; color:var(--ink-faint); letter-spacing:.05em; margin-bottom:5px;}
  .dash-mini-val{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700;}

  .dash-table{width:100%; border-collapse:collapse; margin-top:4px;}
  .dash-table th{text-align:right; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--line-strong);}
  .dash-table th:first-child{text-align:left;}
  .dash-table td{text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 4px; border-bottom:1px solid var(--line);}
  .dash-table td:first-child{text-align:left; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;}
  .dash-table tr.grand td{font-weight:700; border-top:1px solid var(--gold-dim); color:var(--gold);}

  .month-cash-strip{
    display:flex; justify-content:space-between; align-items:center; margin-top:6px; padding:9px 13px;
    background:linear-gradient(135deg,#2a4a37,#1c3327); border:1px solid var(--gelir); border-radius:9px;
  }
  .month-cash-strip span{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim);}
  .month-cash-strip b{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--gelir);}

  .recon-input{width:100%; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 12px; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; margin-top:4px;}
  .recon-input:focus{outline:1px solid var(--gold-dim);}
  .recon-result{margin-top:14px; padding:14px; border-radius:11px; text-align:center;}
  .recon-result.ok{background:rgba(79,178,134,0.12); border:1px solid var(--gelir);}
  .recon-result.bad{background:rgba(193,85,63,0.12); border:1px solid var(--gider);}
  .recon-result.neutral{background:rgba(201,162,77,0.08); border:1px solid var(--gold-dim);}

<script>
  const PRISTINE_HTML = document.documentElement.outerHTML;
(function(){
  const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  const MONTHS_FULL = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const STORAGE_KEY = "cashflow_sheet_v5";

  let appData = null;
  let saveTimer = null;
  let deferredPrompt = null;
  let fileHandle = null;
  let viewMode = 'main';
  let dashRange = { start: 0, end: 11 };
  let dashBankMonth = new Date().getMonth();
  let mainCashMonth = null;
  let mainTableMode = 'month';
  let mainTableMonth = null;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    const btn = document.getElementById('installBtn');
    if(btn) btn.style.display = 'inline-block';
  });

  function mkRow(name){
    const months = [];
    for(let i=0;i<12;i++) months.push({budget:0, actual:0});
    return { id: 'r'+Date.now()+Math.random().toString(36).slice(2,7), name: name, months: months };
  }

  function defaultYearState(){
    return {
      startBalance: 0,
      bankCheck: {},
      gelirGroups: [
        { id:'genel', name:'Genel Gelir', rows:[
          mkRow("Maaş"), mkRow("Müzik / Telif"), mkRow("Sponsorluk"), mkRow("Freelance"), mkRow("Diğer Gelir")
        ]},
        { id:'krediler', name:'Krediler', rows:[] }
      ],
      giderGroups: [
        { id:'nakit', name:'Nakit Giderler', rows:[
          mkRow("Kira"), mkRow("Faturalar"), mkRow("Market"), mkRow("Ulaşım"),
          mkRow("Ekipman"), mkRow("Prodüksiyon"), mkRow("Eğlence"), mkRow("Diğer Gider")
        ]},
        { id:'kredi', name:'Kredi Kartı', rows:[
          mkRow("Kredi Kartı 1")
        ]},
        { id:'krediler', name:'Krediler', rows:[] }
      ]
    };
  }

  function defaultAppData(){
    const y = new Date().getFullYear();
    const data = { currentYear: y, years: {} };
    data.years[y] = defaultYearState();
    return data;
  }

  // ---- Turkish-style number parsing/formatting ----
  function parseTRNumber(v){
    if(v === null || v === undefined) return 0;
    let s = String(v).trim();
    if(s === '') return 0;
    s = s.replace(/\s/g,'');
    const neg = s.indexOf('-') === 0;
    s = s.replace(/-/g,'');
    s = s.replace(/\./g,'').replace(',', '.');
    let n = parseFloat(s);
    if(isNaN(n)) n = 0;
    return neg ? -n : n;
  }
  function fmt(n){
    if(!n) n = 0;
    return n.toLocaleString('tr-TR', {minimumFractionDigits:0, maximumFractionDigits:2});
  }
  function fmtInput(n){
    if(!n) return '';
    return fmt(n);
  }

  function migrateYearState(parsed){
    if(!parsed) return null;
    if(Array.isArray(parsed.gelir) && !parsed.gelirGroups){
      parsed.gelirGroups = [
        { id:'genel', name:'Genel Gelir', rows: parsed.gelir },
        { id:'krediler', name:'Krediler', rows: [] }
      ];
      delete parsed.gelir;
    }
    if(!Array.isArray(parsed.gelirGroups)) return null;
    if(Array.isArray(parsed.gider) && !parsed.giderGroups){
      parsed.giderGroups = [
        { id:'nakit', name:'Nakit Giderler', rows: parsed.gider },
        { id:'kredi', name:'Kredi Kartı', rows: [] }
      ];
      delete parsed.gider;
    }
    if(!Array.isArray(parsed.giderGroups)) return null;
    if(!parsed.giderGroups.find(g=>g.id==='krediler')){
      parsed.giderGroups.push({ id:'krediler', name:'Krediler', rows: [] });
    }
    if(!parsed.gelirGroups.find(g=>g.id==='krediler')){
      parsed.gelirGroups.push({ id:'krediler', name:'Krediler', rows: [] });
    }
    if(typeof parsed.startBalance !== 'number') parsed.startBalance = parseTRNumber(parsed.startBalance);
    if(!parsed.bankCheck || typeof parsed.bankCheck !== 'object') parsed.bankCheck = {};
    return parsed;
  }

  function migrateAppData(raw){
    if(!raw) return null;
    if(raw.years && typeof raw.years === 'object'){
      const years = {};
      let ok = false;
      Object.keys(raw.years).forEach(y=>{
        const ys = migrateYearState(raw.years[y]);
        if(ys){ years[y] = ys; ok = true; }
      });
      if(!ok) return null;
      let currentYear = raw.currentYear;
      if(!years[currentYear]) currentYear = Object.keys(years).sort()[0];
      return { currentYear: parseInt(currentYear,10), years };
    }
    if(Array.isArray(raw.gelir)){
      const ys = migrateYearState(raw);
      if(!ys) return null;
      const y = raw.year || new Date().getFullYear();
      const data = { currentYear: y, years: {} };
      data.years[y] = ys;
      return data;
    }
    return null;
  }

  function readEmbeddedState(){
    try{
      const tag = document.getElementById('app-data');
      if(!tag) return null;
      const text = tag.textContent.trim();
      if(!text || text === '{}') return null;
      return migrateAppData(JSON.parse(text));
    }catch(e){ return null; }
  }

  function loadData(){
    const embedded = readEmbeddedState();
    if(embedded){ appData = embedded; render(); return; }
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? migrateAppData(JSON.parse(raw)) : null;
      appData = parsed || defaultAppData();
    }catch(e){
      appData = defaultAppData();
    }
    render();
  }
  function scheduleSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }catch(e){ console.error(e); }
    }, 400);
  }

  function yearState(){ return appData.years[appData.currentYear]; }

  function sumRows(rows){
    const budget = new Array(12).fill(0);
    const actual = new Array(12).fill(0);
    rows.forEach(r=> r.months.forEach((m,i)=>{ budget[i]+=parseTRNumber(m.budget); actual[i]+=parseTRNumber(m.actual); }));
    return { budget, actual };
  }

  function computeTotals(ys){
    const gelirGroupTotals = ys.gelirGroups.map(g => ({ id:g.id, name:g.name, ...sumRows(g.rows) }));
    const gelirBudget = new Array(12).fill(0);
    const gelirActual = new Array(12).fill(0);
    gelirGroupTotals.forEach(gt=>{
      gt.budget.forEach((v,i)=> gelirBudget[i]+=v);
      gt.actual.forEach((v,i)=> gelirActual[i]+=v);
    });
    const groupTotals = ys.giderGroups.map(g => ({ id:g.id, name:g.name, ...sumRows(g.rows) }));
    const giderBudget = new Array(12).fill(0);
    const giderActual = new Array(12).fill(0);
    groupTotals.forEach(gt=>{
      gt.budget.forEach((v,i)=> giderBudget[i]+=v);
      gt.actual.forEach((v,i)=> giderActual[i]+=v);
    });
    const netBudget = gelirBudget.map((g,i)=> g - giderBudget[i]);
    const netActual = gelirActual.map((g,i)=> g - giderActual[i]);
    const netFark = netActual.map((n,i)=> n - netBudget[i]);
    const devir = [];
    netActual.forEach((n,i)=>{
      const prev = i===0 ? parseTRNumber(ys.startBalance) : devir[i-1];
      devir.push(prev + n);
    });
    const devirBudget = [];
    netBudget.forEach((n,i)=>{
      const prev = i===0 ? parseTRNumber(ys.startBalance) : devirBudget[i-1];
      devirBudget.push(prev + n);
    });
    return { gelirBudget, gelirActual, gelirGroupTotals, groupTotals, giderBudget, giderActual, netBudget, netActual, netFark, devir, devirBudget };
  }

  function computeBlendedCash(ys, t){
    let relevantMonthIdx = -1;
    for(let i=11;i>=0;i--){
      if(t.gelirActual[i]!==0 || t.giderActual[i]!==0){ relevantMonthIdx = i; break; }
    }
    if(relevantMonthIdx === -1){
      const realNow = new Date();
      relevantMonthIdx = (appData.currentYear === realNow.getFullYear()) ? realNow.getMonth() : 0;
    }
    const blended = [];
    for(let i=0;i<12;i++){
      const net = (i<=relevantMonthIdx) ? t.netActual[i] : t.netBudget[i];
      const prev = i===0 ? parseTRNumber(ys.startBalance) : blended[i-1];
      blended.push(prev + net);
    }
    return { relevantMonthIdx, blended };
  }

  function rowTotals(r){
    let b=0,a=0;
    r.months.forEach(m=>{ b+=parseTRNumber(m.budget); a+=parseTRNumber(m.actual); });
    return { budget:b, actual:a, fark:a-b };
  }

  function rangeSum(arr, s, e){ let sum=0; for(let i=s;i<=e;i++) sum+=arr[i]; return sum; }

  function buildHtmlWithState(){
    const dataJson = JSON.stringify(appData).replace(/</g, '\\u003c');
    return '<!DOCTYPE html>\n' + PRISTINE_HTML.replace(
      /(<script id="app-data" type="application\/json">)([\s\S]*?)(<\/script>)/,
      function(m, p1, p2, p3){ return p1 + dataJson + p3; }
    );
  }

  function attachBackupBar(){
    document.getElementById('exportBtn').onclick = ()=>{
      try{
        const blob = new Blob([buildHtmlWithState()], {type:'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        a.href = url;
        a.download = 'nakit-akisi-kopya-'+stamp+'.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(()=> URL.revokeObjectURL(url), 2000);
      }catch(e){ alert('İndirme başarısız oldu.'); }
    };

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.onclick = async ()=>{
      if(!window.showSaveFilePicker){
        alert('Bu tarayıcı dosyanın üstüne doğrudan kaydetmeyi desteklemiyor. Bunun yerine "Kopya İndir" kullan ve indirdiğin dosyayı eskisinin üzerine taşı.');
        return;
      }
      try{
        if(!fileHandle){
          fileHandle = await window.showSaveFilePicker({
            suggestedName: 'nakit-akisi-carsaf.html',
            types: [{ description:'HTML dosyası', accept:{'text/html':['.html']} }]
          });
        }
        const writable = await fileHandle.createWritable();
        await writable.write(buildHtmlWithState());
        await writable.close();
        const original = saveBtn.textContent;
        saveBtn.textContent = '✓ Kaydedildi';
        setTimeout(()=>{ saveBtn.textContent = original; }, 1400);
      }catch(e){
        if(e && e.name !== 'AbortError'){
          alert('Kaydetme başarısız: ' + e.message);
        }
      }
    };

    document.getElementById('importBtn').onclick = async ()=>{
      if(window.showOpenFilePicker){
        try{
          const [handle] = await window.showOpenFilePicker({
            types: [{ description:'HTML dosyası', accept:{'text/html':['.html','.htm']} }]
          });
          const file = await handle.getFile();
          const text = await file.text();
          const match = text.match(/<script id="app-data" type="application\/json">([\s\S]*?)<\/script>/);
          if(!match){ alert('Bu dosyada uygulama verisi bulunamadı.'); return; }
          const parsed = migrateAppData(JSON.parse(match[1].trim() || '{}'));
          if(!parsed){ alert('Bu dosya geçerli bir yedek dosyası değil.'); return; }
          fileHandle = handle;
          appData = parsed;
          scheduleSave();
          render();
        }catch(e){
          if(e && e.name !== 'AbortError') alert('Dosya açılamadı: ' + e.message);
        }
      } else {
        document.getElementById('importFile').click();
      }
    };
    document.getElementById('importFile').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const text = ev.target.result;
          const match = text.match(/<script id="app-data" type="application\/json">([\s\S]*?)<\/script>/);
          if(!match){ alert('Bu dosyada uygulama verisi bulunamadı.'); return; }
          const parsed = migrateAppData(JSON.parse(match[1].trim() || '{}'));
          if(!parsed){ alert('Bu dosya geçerli bir yedek dosyası değil.'); return; }
          appData = parsed;
          scheduleSave();
          render();
        }catch(err){
          alert('Dosya okunamadı. Geçerli bir .html yedek dosyası seçtiğinden emin ol.');
        }
      };
      reader.readAsText(file);
    };

    const installBtn = document.getElementById('installBtn');
    if(installBtn){
      installBtn.onclick = async ()=>{
        if(deferredPrompt){
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
        }
      };
    }
  }

  function attachSaveOnlyBtn(){
    const saveBtn = document.getElementById('saveBtn');
    if(!saveBtn) return;
    saveBtn.onclick = async ()=>{
      if(!window.showSaveFilePicker){
        alert('Bu tarayıcı dosyanın üstüne doğrudan kaydetmeyi desteklemiyor. Ana ekrandaki "Kopya İndir"i kullan.');
        return;
      }
      try{
        if(!fileHandle){
          fileHandle = await window.showSaveFilePicker({
            suggestedName: 'nakit-akisi-carsaf.html',
            types: [{ description:'HTML dosyası', accept:{'text/html':['.html']} }]
          });
        }
        const writable = await fileHandle.createWritable();
        await writable.write(buildHtmlWithState());
        await writable.close();
        const original = saveBtn.textContent;
        saveBtn.textContent = '✓ Kaydedildi';
        setTimeout(()=>{ saveBtn.textContent = original; }, 1400);
      }catch(e){
        if(e && e.name !== 'AbortError'){
          alert('Kaydetme başarısız: ' + e.message);
        }
      }
    };
  }

  function render(){
    if(viewMode === 'dashboard'){ renderDashboard(); return; }
    if(viewMode === 'report'){ renderReport(); return; }
    if(viewMode === 'dashsheet'){ renderDashSheet(); return; }
    if(viewMode === 'monthscreen'){ renderMonthScreen(); return; }
    const app = document.getElementById('app');
    const prevGridWrap = document.querySelector('.grid-wrap');

    const prevGridScrollTop = prevGridWrap ? prevGridWrap.scrollTop : 0;
    const prevAppScrollTop = app.scrollTop;
    const ys = yearState();
    const t = computeTotals(ys);

    const blendedInfo = computeBlendedCash(ys, t);
    const relevantMonthIdx = blendedInfo.relevantMonthIdx;
    const blended = blendedInfo.blended;
    const relMonthName = MONTHS_FULL[relevantMonthIdx];
    const relBudget = t.netBudget[relevantMonthIdx];
    const relActual = t.netActual[relevantMonthIdx];
    const relFark = t.netFark[relevantMonthIdx];

    let html = '';
    html += '<header><p class="eyebrow">Manuel Çarşaf Rapor</p><h1>Nakit Akışı Tablosu</h1><p class="hint">Bir aya Bütçe girdiğinde o aydan itibaren sonraki aylara otomatik dağıtılır, istediğin ayı sonradan değiştirebilirsin.</p>'
      + '<div class="explain-box">'
      + '<p><b style="color:var(--gelir);">🟢 AY SONU NAKDİM</b> (en alttaki yeşil satır) — <b>bu asıl cevap.</b> Her ay için: o ay geçtiyse gerçekleşen rakamı, henüz gelmediyse bütçedeki planı kullanır. "Bu ay sonunda cebimde ne kalır?" sorusunun tek ve net cevabı budur.</p>'
      + '<p><b style="color:var(--gold);">⚪ REFERANS (2 uç senaryo)</b> — sadece merak edenler için iki teorik uç durumu gösterir: <i>"hep bütçe gibi gitseydi"</i> ve <i>"bundan sonra hiçbir şey olmasaydı"</i>. Bu ikisi normalde AY SONU NAKDİM\'den farklı çıkar, bu bir hata değildir — farklı sorulara cevap verirler. Karışıklık yaratıyorsa bu satırı yok sayabilir, sadece yeşil satıra bakabilirsin.</p>'
      + '</div></header>';

    const years = Object.keys(appData.years).map(y=>parseInt(y,10)).sort((a,b)=>a-b);
    html += '<div class="year-bar"><div class="year-scroll">';
    years.forEach(y=>{
      html += '<button class="year-chip'+(y===appData.currentYear?' active':'')+'" data-year="'+y+'">'+y+'</button>';

    html += '</div><button class="year-add" id="addYearBtn" title="Yeni yıl ekle">+</button></div>';

    if(mainTableMonth === null) mainTableMonth = relevantMonthIdx;
    html += '<div class="dash-btn-row"><button class="dash-btn entry-btn" id="openMonthBtn">📝 '+MONTHS_FULL[mainTableMonth]+' Girişini Yap</button></div>';
    html += '<div class="dash-btn-row" style="padding-top:0;"><button class="dash-btn" id="openDashBtn">📊 Dashboard\'u Aç</button></div>';

    html += '<div class="topbar">';
    html += '<div class="topfield"><label>Başlangıç Devir Bakiyesi ('+appData.currentYear+')</label><input type="text" inputmode="decimal" id="startBalInput" value="'+fmtInput(ys.startBalance)+'"></div>';
    html += '</div>';

    html += '<div class="install-note"><b>Telefona kurmak için:</b> Chrome menüsü (⋮) → "Uygulamayı yükle" veya "Ana ekrana ekle". Simge ana ekranına eklenir, tam ekran açılır.<br><button id="installBtn" style="display:none;">Şimdi Yükle</button></div>';

    html += '<div class="backup-bar">';
    html += '<button class="backup-btn primary" id="saveBtn">💾 Kaydet</button>';
    html += '<button class="backup-btn" id="importBtn">📂 Aç</button>';
    html += '<button class="backup-btn" id="exportBtn">⬇️ Kopya İndir</button>';
    html += '<input type="file" id="importFile" accept="text/html,.html,.htm">';
    html += '</div>';
    html += '<div class="swipe-note" style="margin-top:-6px;">İlk "Kaydet"te dosyanı seç (üstüne yazmak için aynısını seç) — sonraki her "Kaydet" o dosyanın üstüne yazar. Tüm yıllar aynı dosyada saklanır.</div>';

    const budgetToDate = t.netBudget.slice(0, relevantMonthIdx+1).reduce((a,b)=>a+b,0);
    const fairFark = yNetA - budgetToDate;

    html += '<p class="card-section-label">YIL GENELİ — '+appData.currentYear+'</p>';
    html += '<div class="summary-cards">';
    html += scard('Bütçe Net (Tüm Yıl Planı)', yNetB, yNetB>=0?'pos':'neg');
    html += scard('Gerçekleşen Net (Oca–'+relMonthName+')', yNetA, yNetA>=0?'pos':'neg');
    html += scard('Fark (Aynı Dönem)', fairFark, fairFark>=0?'pos':'neg');
    html += scard('Güncel Devir', currentDevir, 'gold');
    html += '</div>';
    html += '<p class="hint" style="padding:2px 14px 6px;">"Fark (Aynı Dönem)": Ocak–'+relMonthName+' arası gerçekleşen ile aynı ayların bütçesi karşılaştırılır (Ocak\'tan '+MONTHS_FULL[11]+'\'a tüm yılın bütçesiyle değil) — bu yüzden daha adil bir karşılaştırmadır.</p>';

    html += '<p class="card-section-label">SADECE '+relMonthName.toUpperCase()+' AYI'+((t.gelirActual[relevantMonthIdx]===0 && t.giderActual[relevantMonthIdx]===0) ? ' (henüz veri yok, bütçe gösteriliyor)':'')+'</p>';
    html += '<div class="summary-cards" style="padding-top:0;">';
    html += scard(relMonthName+' Bütçe Net', relBudget, relBudget>=0?'pos':'neg');
    html += scard(relMonthName+' Gerçek Net', relActual, relActual>=0?'pos':'neg');
    html += scard(relMonthName+' Fark', relFark, relFark>=0?'pos':'neg');
    html += '</div>';
    if(Math.abs(yNetA - relActual) < 0.01){
      html += '<p class="hint" style="padding:0 14px 6px;">Not: Gerçekleşen Net ile '+relMonthName+' Gerçek Net aynı görünüyor çünkü bu yıl için şu ana kadar sadece '+relMonthName+' ayında gerçekleşen veri girildi.</p>';
    }

    if(mainCashMonth === null) mainCashMonth = relevantMonthIdx;
    const mcIsFuture = mainCashMonth > relevantMonthIdx;
    const mcCash = blended[mainCashMonth];
    html += '<div class="cash-picker-card">';
    html += '<div class="cash-picker-row"><label>Hangi ayın sonunda elimde ne kalır?</label><select id="mainCashMonthSelect">';

    html += '</select></div>';
    html += '<div class="cash-picker-result"><span>'+MONTHS_FULL[mainCashMonth]+' Sonu Nakdim'+(mcIsFuture?' <b class="blend-tag" style="margin-left:4px;">tahmini</b>':'')+'</span><b class="'+(mcCash>=0?'pos':'neg')+'">'+(mcCash>=0?'+':'')+fmt(mcCash)+' ₺</b></div>';
    html += '</div>';

    app.innerHTML = html;
    attachHandlers();

    app.scrollTop = prevAppScrollTop;
  }

  function scard(label, val, cls){
    return '<div class="scard"><div class="scard-label">'+label+'</div><div class="scard-val '+cls+'">'+(val>=0&&cls==='pos'?'+':'')+fmt(val)+' ₺</div></div>';
  }

  function renderRow(r, idx, type, groupId, monthsToShow, showTotals){
    const tot = rowTotals(r);
    const isGider = (type === 'gider');
    const rowCls = type+'-row'+((groupId==='kredi'||groupId==='krediler') ? ' group-kredi' : '');
    let html = '<tr class="'+rowCls+'" data-type="'+type+'" data-idx="'+idx+'"'+(groupId?(' data-group="'+groupId+'"'):'')+'>';
    html += '<td class="sticky-col"><div class="sticky-col-inner"><button class="del-btn-inline" data-del="'+type+'" data-delidx="'+idx+'"'+(groupId?(' data-delgroup="'+groupId+'"'):'')+' title="Kategoriyi sil">✕</button><input class="cat-input" value="'+escapeAttr(r.name)+'" data-field="name"></div></td>';
    monthsToShow.forEach(i=>{
      const m = r.months[i];
      const b = parseTRNumber(m.budget), a = parseTRNumber(m.actual);
      const f = isGider ? (b - a) : (a - b);
      const filled = a !== 0;
      const fc = filled ? ' cell-filled' : '';
      const bDisp = isGider ? -b : b;
      const aDisp = isGider ? -a : a;
      const matched = (b !== 0 && a === b);
      html += '<td class="'+fc.trim()+' budget-cell"><div class="budget-cell-inner"><input class="cell-input budget" type="text" inputmode="decimal" value="'+fmtInput(bDisp)+'" data-field="budget" data-month="'+i+'"><input type="checkbox" class="sync-check" data-month="'+i+'" title="Bütçeyi gerçekleşene kopyala"'+(matched?' checked':'')+'></div></td>';
      html += '<td class="'+fc.trim()+'"><input class="cell-input actual" type="text" inputmode="decimal" value="'+fmtInput(aDisp)+'" data-field="actual" data-month="'+i+'"></td>';
      html += '<td class="fark-cell'+fc+' '+(f>=0?'pos':'neg')+'">'+(f>=0?'+':'')+fmt(f)+'</td>';
    });
    if(showTotals){
      const totFark = isGider ? (tot.budget - tot.actual) : tot.fark;
      const totBudgetDisp = isGider ? -tot.budget : tot.budget;
      const totActualDisp = isGider ? -tot.actual : tot.actual;
      html += '<td class="readonly-cell '+(type==='gelir'?'gelir-c':'gider-c')+'">'+fmt(totBudgetDisp)+'</td>';
      html += '<td class="readonly-cell '+(type==='gelir'?'gelir-c':'gider-c')+'">'+fmt(totActualDisp)+'</td>';
      html += '<td class="readonly-cell '+(totFark>=0?'pos':'neg')+'">'+(totFark>=0?'+':'')+fmt(totFark)+'</td>';
    }
    html += '</tr>';
    return html;
  }

  function subtotalRowHtml(label, budgetArr, actualArr, isGider, monthsToShow, showTotals){
    let html = '<tr class="subtotal-row"><td class="sticky-col">'+escapeAttr(label)+'</td>';
    let yb=0, ya=0;
    monthsToShow.forEach(i=>{
      const f = isGider ? (budgetArr[i]-actualArr[i]) : (actualArr[i]-budgetArr[i]);
      const bDisp = isGider ? -budgetArr[i] : budgetArr[i];
      const aDisp = isGider ? -actualArr[i] : actualArr[i];
      html += '<td class="readonly-cell">'+fmt(bDisp)+'</td>';
      html += '<td class="readonly-cell">'+fmt(aDisp)+'</td>';
      html += '<td class="fark-cell '+(f>=0?'pos':'neg')+'">'+(f>=0?'+':'')+fmt(f)+'</td>';
    });
    if(showTotals){
      for(let i=0;i<12;i++){ yb += budgetArr[i]; ya += actualArr[i]; }
      const yf = isGider ? (yb-ya) : (ya-yb);
      const ybDisp = isGider ? -yb : yb;
      const yaDisp = isGider ? -ya : ya;
      html += '<td class="readonly-cell">'+fmt(ybDisp)+'</td>';
      html += '<td class="readonly-cell">'+fmt(yaDisp)+'</td>';
      html += '<td class="readonly-cell '+(yf>=0?'pos':'neg')+'">'+(yf>=0?'+':'')+fmt(yf)+'</td>';
    }
    html += '</tr>';
    return html;
  }

      const aDisp = isGider ? -actualArr[i] : actualArr[i];

      const ybDisp = isGider ? -yb : yb;
      const yaDisp = isGider ? -ya : ya;

  function escapeAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  function findGroup(ys, type, groupId){
    const groups = type === 'gelir' ? ys.gelirGroups : ys.giderGroups;
    return groups.find(g=> g.id === groupId);
  }
  function findGiderGroup(ys, groupId){
    return findGroup(ys, 'gider', groupId);
  }

  // ---------------- Dashboard ----------------
  function renderDashboard(){
    const app = document.getElementById('app');
    const ys = yearState();
    const t = computeTotals(ys);
    const s = dashRange.start, e = dashRange.end;

    const rGelirB = rangeSum(t.gelirBudget, s, e);
    const rGelirA = rangeSum(t.gelirActual, s, e);
    const rGiderB = rangeSum(t.giderBudget, s, e);
    const rGiderA = rangeSum(t.giderActual, s, e);
    const rNetB = rGelirB - rGiderB;
    const rNetA = rGelirA - rGiderA;
    const rFark = rNetA - rNetB;
    const rangeBlendInfo = computeBlendedCash(ys, t);
    const rangeEndBlended = rangeBlendInfo.blended[e];
    const rangeEndIsFuture = e > rangeBlendInfo.relevantMonthIdx;

    let html = '';
    html += '<header><p class="eyebrow">Dashboard</p><h1>Dönem Özeti — '+appData.currentYear+'</h1><p class="hint">Seçtiğin ay aralığı için bütçe / gerçekleşen toplamları ve banka bakiye kontrolü.</p></header>';
    html += '<button class="back-btn" id="backBtn">← Ana Ekrana Dön</button>';
    html += '<div class="dash-btn-row"><button class="dash-btn" id="openReportBtn">📄 Finansal Analiz Raporu Oluştur</button></div>';
    html += '<div class="dash-btn-row" style="padding-top:0;"><button class="dash-btn" id="openSheetBtn">📋 Kategori Bazlı Aylık Çarşaf Rapor</button></div>';

    html += '<div class="dash-section"><div class="dash-card">';
    html += '<h3>Dönem Aralığı</h3>';
    html += '<div class="range-row">';
    html += '<div class="range-field"><label>Başlangıç Ayı</label><select id="rangeStart">';
    MONTHS_FULL.forEach((m,i)=> html += '<option value="'+i+'"'+(i===s?' selected':'')+'>'+m+'</option>');
    html += '</select></div>';
    html += '<div class="range-field"><label>Bitiş Ayı</label><select id="rangeEnd">';
    MONTHS_FULL.forEach((m,i)=> html += '<option value="'+i+'"'+(i===e?' selected':'')+'>'+m+'</option>');
    html += '</select></div>';
    html += '</div>';

    html += '<div class="dash-grid">';
    html += dashMini('Bütçe Gelir', rGelirB, rGelirB>=0?'pos':'neg');
    html += dashMini('Gerçek Gelir', rGelirA, rGelirA>=0?'pos':'neg');
    html += dashMini('Bütçe Gider', -rGiderB, 'neg');
    html += dashMini('Gerçek Gider', -rGiderA, 'neg');
    html += dashMini('Bütçe Net', rNetB, rNetB>=0?'pos':'neg');
    html += dashMini('Gerçek Net', rNetA, rNetA>=0?'pos':'neg');
    html += '</div>';
    html += '<div class="dash-grid" style="margin-top:8px;">';
    html += dashMini(MONTHS_FULL[e]+' Sonu Nakdim'+(rangeEndIsFuture?' (tahmini)':''), rangeEndBlended, rangeEndBlended>=0?'pos':'neg');
    html += '</div>';
    html += '<p class="hint" style="padding:6px 2px 0;">"'+MONTHS_FULL[e]+' Sonu Nakdim" — gerçekleşen aylarda gerçek, henüz gelmeyen aylarda bütçe rakamı kullanılarak hesaplanan, dönem sonunda elinde kalacak tahmini nakit.</p>';

    html += '<p class="hint" style="padding:4px 2px 8px;">Not: "Bütçe" seçtiğin aralığın tamamını kapsar, "Gerçek" ise sadece o aralıkta veri girdiğin ayları — aradaki fark ("Fark" sütunu) bu yüzden henüz gelmemiş ayları da içerir, tek başına bir başarısızlık göstergesi değildir.</p>';
    html += '<table class="dash-table"><thead><tr><th>Kalem</th><th>Bütçe</th><th>Gerçek</th><th>Fark</th></tr></thead><tbody>';
    t.gelirGroupTotals.forEach(gt=>{
      const gb = rangeSum(gt.budget, s, e), ga = rangeSum(gt.actual, s, e);
      html += dashTableRow(gt.name, gb, ga, false);
    });
    html += dashTableRow('Toplam Gelir', rGelirB, rGelirA, false);
    t.groupTotals.forEach(gt=>{
      const gb = rangeSum(gt.budget, s, e), ga = rangeSum(gt.actual, s, e);
      html += dashTableRow(gt.name, gb, ga, true);
    });
    html += dashTableRow('Toplam Gider', rGiderB, rGiderA, true);
    html += '<tr class="grand"><td>NET</td><td>'+fmt(rNetB)+'</td><td>'+fmt(rNetA)+'</td><td class="'+(rFark>=0?'':'')+'" style="color:'+(rFark>=0?'#4fb286':'#c1553f')+'">'+(rFark>=0?'+':'')+fmt(rFark)+'</td></tr>';
    html += '</tbody></table>';

    html += '<h3 style="margin-top:20px;">Ay Bazında Elimde Ne Kalır?</h3>';
    html += '<p class="hint" style="padding:0 0 8px;"><b style="color:var(--gelir);">"Gerçek/Tahmini"</b> sütunu asıl cevaptır (ana ekrandaki "AY SONU NAKDİM" ile aynı). <b style="color:var(--gold-dim);">"Sadece Bütçeydi"</b> sütunu ise sadece referans için: "hep plan gibi gitseydi ne olurdu" senaryosu.</p>';
    html += '<table class="dash-table"><thead><tr><th>Ay</th><th>Sadece Bütçeydi</th><th>Gerçek/Tahmini</th><th>Fark</th></tr></thead><tbody>';
    for(let mi=s; mi<=e; mi++){
      const mb = t.devirBudget[mi];
      const ma = rangeBlendInfo.blended[mi];
      const mf = ma - mb;
      const isFut = mi > rangeBlendInfo.relevantMonthIdx;
      html += '<tr'+(mi===e?' class="grand"':'')+'><td>'+MONTHS_FULL[mi]+(isFut?' <span style="font-size:9px; color:var(--gold-dim);">(tahmini)</span>':'')+'</td><td style="color:var(--ink-faint);">'+fmt(mb)+'</td><td style="color:var(--gelir); font-weight:700;">'+fmt(ma)+'</td><td style="color:'+(mf>=0?'#4fb286':'#c1553f')+'">'+(mf>=0?'+':'')+fmt(mf)+'</td></tr>';
    }
    html += '</tbody></table>';
    html += '</div>';

    // Bank reconciliation
    const blendedInfo = rangeBlendInfo;
    const bankVal = ys.bankCheck && ys.bankCheck[dashBankMonth] !== undefined ? ys.bankCheck[dashBankMonth] : null;
    const computedDevir = blendedInfo.blended[dashBankMonth];
    const isFutureMonth = dashBankMonth > blendedInfo.relevantMonthIdx;
    html += '<div class="dash-card">';
    html += '<h3>Banka Bakiye Kontrolü</h3>';
    html += '<div class="range-row"><div class="range-field"><label>Ay</label><select id="bankMonthSelect">';
    MONTHS_FULL.forEach((m,i)=> html += '<option value="'+i+'"'+(i===dashBankMonth?' selected':'')+'>'+m+'</option>');
    html += '</select></div></div>';
    html += '<label style="font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);">Banka Nakit Bakiyesi ('+MONTHS_FULL[dashBankMonth]+')</label>';
    html += '<input type="text" inputmode="decimal" class="recon-input" id="bankBalInput" value="'+(bankVal!==null?fmtInput(bankVal):'')+'" placeholder="0,00">';

    const devirLabel = 'Hesaplanan Net Cash (Ay Sonu Nakdim'+(isFutureMonth?' — tahmini, kalan aylar bütçeden':' — gerçekleşen')+'): '+fmt(computedDevir)+' ₺';
    if(bankVal !== null){
      const diff = bankVal - computedDevir;
      const cls = Math.abs(diff) < 0.01 ? 'ok' : (diff < 0 ? 'bad' : 'ok');
      const label = Math.abs(diff) < 0.01 ? 'Tam Uyumlu' : (diff < 0 ? 'Eksik (Hesaplanandan Az)' : 'Fazla (Hesaplanandan Çok)');
      html += '<div class="recon-result '+cls+'">';
      html += '<div class="recon-label">'+devirLabel+'</div>';
      html += '<div class="recon-val '+(diff<0?'neg':'pos')+'">'+(diff>=0?'+':'')+fmt(diff)+' ₺</div>';
      html += '<div class="recon-label" style="margin-top:4px;">'+label+'</div>';
      html += '</div>';
    } else {
      html += '<div class="recon-result neutral"><div class="recon-label">'+devirLabel+' — karşılaştırmak için banka bakiyeni gir</div></div>';
    }
    html += '</div>';
    html += '</div>';

    app.innerHTML = html;
    attachDashboardHandlers();
  }

  function dashMini(label, val, cls){
    return '<div class="dash-mini"><div class="dash-mini-label">'+label+'</div><div class="dash-mini-val '+cls+'">'+(val>=0&&cls==='pos'?'+':'')+fmt(val)+' ₺</div></div>';
  }
  function dashTableRow(label, b, a, isGider){
    const f = isGider ? (b-a) : (a-b);
    const bDisp = isGider ? -b : b;
    const aDisp = isGider ? -a : a;
    return '<tr><td>'+escapeAttr(label)+'</td><td>'+fmt(bDisp)+'</td><td>'+fmt(aDisp)+'</td><td style="color:'+(f>=0?'#4fb286':'#c1553f')+'">'+(f>=0?'+':'')+fmt(f)+'</td></tr>';
  }

  // ---------------- Report engine ----------------
  function analyzeYear(ys){
    const t = computeTotals(ys);
    let lastActive = -1;
    for(let i=11;i>=0;i--){
      if(t.gelirActual[i]!==0 || t.giderActual[i]!==0){ lastActive = i; break; }
    }
    const hasData = lastActive >= 0;
    const activeCount = lastActive+1;
    const sr = (arr,s,e)=>{ let x=0; for(let i=s;i<=e;i++) x+=arr[i]; return x; };

    const yearIncB = sr(t.gelirBudget,0,11);
    const yearExpB = sr(t.giderBudget,0,11);

    if(!hasData){
      return {
        hasData:false, yearIncB, yearExpB, yearNetB: yearIncB-yearExpB,
        groupBudgets: t.groupTotals.map(g=>({name:g.name, budget: sr(g.budget,0,11)})),
        startBalance: parseTRNumber(ys.startBalance)
      };
    }

    const incB = sr(t.gelirBudget,0,lastActive);
    const incA = sr(t.gelirActual,0,lastActive);
    const expB = sr(t.giderBudget,0,lastActive);
    const expA = sr(t.giderActual,0,lastActive);
    const netA = incA-expA;
    const netB = incB-expB;

    const groupToDate = t.groupTotals.map(g=>({ name:g.name, budget:sr(g.budget,0,lastActive), actual:sr(g.actual,0,lastActive) }));
    const krediGroup = groupToDate.find(g=> g.name.toLowerCase().indexOf('kredi') >= 0);
    const krediOran = expA>0 && krediGroup ? (krediGroup.actual/expA*100) : 0;

    const currentDevir = t.devir[lastActive];
    const netsToDate = [];
    for(let i=0;i<=lastActive;i++) netsToDate.push(t.gelirActual[i]-t.giderActual[i]);
    const avgNet = activeCount>0 ? netA/activeCount : 0;
    const recentCount = Math.min(3, netsToDate.length);
    const recentAvg = recentCount>0 ? netsToDate.slice(-recentCount).reduce((a,b)=>a+b,0)/recentCount : 0;
    const remainingMonths = 12-activeCount;
    const projectedYearEnd = currentDevir + recentAvg*remainingMonths;
    let monthsToNegative = null;
    if(recentAvg<0 && currentDevir>0){
      monthsToNegative = Math.ceil(currentDevir/(-recentAvg));
    }
    const incSapma = incB!==0 ? ((incA-incB)/Math.abs(incB)*100) : null;
    const expSapma = expB!==0 ? ((expA-expB)/Math.abs(expB)*100) : null;

    // ---- "Ay Sonu Nakdim" projection — SAME function used on the main screen and Dashboard, so the number always matches everywhere ----
    const blendedInfo = computeBlendedCash(ys, t);
    const blended = blendedInfo.blended;
    let monthsToNegative_budget = null;
    for(let i=lastActive+1;i<=11;i++){
      if(monthsToNegative_budget === null && blended[i] < 0){
        monthsToNegative_budget = i - lastActive;
      }
    }
    const projectedYearEnd_budget = blended[11];
    let projectionDivergence = null;
    if(remainingMonths > 0){
      const base = Math.max(Math.abs(projectedYearEnd), Math.abs(projectedYearEnd_budget), 1);
      projectionDivergence = Math.abs(projectedYearEnd - projectedYearEnd_budget) / base * 100;
    }

    return {
      hasData:true, activeCount, lastActive, incB, incA, expB, expA, netA, netB,
      groupToDate, krediOran, currentDevir, avgNet, recentAvg, recentCount, remainingMonths,
      projectedYearEnd, monthsToNegative, incSapma, expSapma,
      projectedYearEnd_budget, monthsToNegative_budget, projectionDivergence,
      startBalance: parseTRNumber(ys.startBalance)
    };
  }

  // ---------------- Full-screen single-month data entry ----------------
  function renderMonthScreen(){
    const app = document.getElementById('app');
    const ys = yearState();
    const t = computeTotals(ys);
    const blendedInfo = computeBlendedCash(ys, t);
    const relevantMonthIdx = blendedInfo.relevantMonthIdx;

    const monthIdx = mainTableMonth;
    const monthsToShow = [monthIdx];

    const yGelirB = t.gelirBudget.reduce((a,b)=>a+b,0);
    const yGelirA = t.gelirActual.reduce((a,b)=>a+b,0);
    const yGiderB = t.giderBudget.reduce((a,b)=>a+b,0);
    const yGiderA = t.giderActual.reduce((a,b)=>a+b,0);
    const yNetB = yGelirB - yGiderB;
    const yNetA = yGelirA - yGiderA;

    let html = '<div class="month-screen-header">';

    html += '</select>';
    html += '<button class="month-nav-btn" id="nextMonthBtn" '+(monthIdx===11?'disabled':'')+'>›</button>';
    html += '</div>';
    html += '<button class="backup-btn primary" id="saveBtn" style="flex:none; padding:9px 14px;">💾 Kaydet</button>';
    html += '</div>';

    html += '<tr class="sub-header"><th class="b-col">Bütçe</th><th class="g-col">Gerçek</th><th class="f-col">Fark</th></tr>';
