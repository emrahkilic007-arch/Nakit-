    const totalCols = 4;
    html += '<tr class="section-row"><td class="sticky-col" colspan="'+totalCols+'">GELİR</td></tr>';
    ys.gelirGroups.forEach(group=>{
      html += '<tr class="subsection-row'+(group.id==='krediler'?' kredi':'')+'"><td class="sticky-col" colspan="'+totalCols+'">'+escapeAttr(group.name)+'</td></tr>';
      group.rows.forEach((r,idx)=> html += renderRow(r, idx, 'gelir', group.id, monthsToShow, false));
      html += '<tr class="add-row"><td class="sticky-col" colspan="'+totalCols+'"><button class="add-btn" data-add="gelir" data-group="'+group.id+'">+ '+escapeAttr(group.name)+' Kategorisi Ekle</button></td></tr>';
      const gtg = sumRows(group.rows);
      html += subtotalRowHtml(group.name+' Toplamı', gtg.budget, gtg.actual, false, monthsToShow, false);
    });

    html += '<tr class="section-row"><td class="sticky-col" colspan="'+totalCols+'">GİDER</td></tr>';
    ys.giderGroups.forEach(group=>{
      html += '<tr class="subsection-row'+(group.id==='kredi'||group.id==='krediler'?' kredi':'')+'"><td class="sticky-col" colspan="'+totalCols+'">'+escapeAttr(group.name)+'</td></tr>';
      group.rows.forEach((r,idx)=> html += renderRow(r, idx, 'gider', group.id, monthsToShow, false));
      html += '<tr class="add-row"><td class="sticky-col" colspan="'+totalCols+'"><button class="add-btn" data-add="gider" data-group="'+group.id+'">+ '+escapeAttr(group.name)+' Kategorisi Ekle</button></td></tr>';
      const gt = sumRows(group.rows);
      html += subtotalRowHtml(group.name+' Toplamı', gt.budget, gt.actual, true, monthsToShow, false);
    });

    html += totalRow('TOPLAM GELİR', t.gelirBudget, t.gelirActual, yGelirB, yGelirA, 'gelir-c', false, monthsToShow, false);
    html += totalRow('TOPLAM GİDER', t.giderBudget, t.giderActual, yGiderB, yGiderA, 'gider-c', true, monthsToShow, false);
    html += netRowHtml(t.netBudget, t.netActual, t.netFark, yNetB, yNetA, yNetA-yNetB, monthsToShow, false);
    html += blendedCashRowHtml(blendedInfo.blended, relevantMonthIdx, monthsToShow, false);
    html += devirRowHtml(t.devirBudget, t.devir, monthsToShow, false);

    html += '</tbody></table></div>';

    app.innerHTML = html;
    attachMonthScreenHandlers(ys, monthIdx);
  }

  function attachMonthScreenHandlers(ys, monthIdx){
    document.getElementById('backToHomeBtn').onclick = ()=>{ viewMode='main'; render(); };
    document.getElementById('monthScreenSelect').onchange = (e)=>{
      mainTableMonth = parseInt(e.target.value,10);
      render();
    };
    const prevBtn = document.getElementById('prevMonthBtn');
    if(prevBtn) prevBtn.onclick = ()=>{ if(mainTableMonth>0){ mainTableMonth--; render(); } };
    const nextBtn = document.getElementById('nextMonthBtn');
    if(nextBtn) nextBtn.onclick = ()=>{ if(mainTableMonth<11){ mainTableMonth++; render(); } };

    attachSaveOnlyBtn();

    document.querySelectorAll('tr[data-type]').forEach(tr=>{
      const type = tr.dataset.type, idx = parseInt(tr.dataset.idx,10);
      const group = findGroup(ys, type, tr.dataset.group);
      let row = group.rows[idx];
      tr.querySelectorAll('input').forEach(inp=>{
        if(inp.classList.contains('sync-check')){
          inp.onchange = ()=>{
            const mIdx = parseInt(inp.dataset.month,10);
            if(inp.checked){
              row.months[mIdx].actual = parseTRNumber(row.months[mIdx].budget);
            } else {
              row.months[mIdx].actual = 0;
            }
            scheduleSave();
            render();
          };
          return;
        }
        inp.onchange = ()=>{
          const field = inp.dataset.field;
          if(field === 'name'){
            row.name = inp.value;
          } else if(field === 'budget'){
            const mIdx = parseInt(inp.dataset.month,10);
            let val = parseTRNumber(inp.value);
            if(type === 'gider') val = Math.abs(val);
            for(let i=mIdx;i<12;i++){ row.months[i].budget = val; }
          } else if(field === 'actual'){
            let val = parseTRNumber(inp.value);
            if(type === 'gider') val = Math.abs(val);
            row.months[parseInt(inp.dataset.month,10)].actual = val;
          }
          scheduleSave();
          render();
        };
      });
    });

    document.querySelectorAll('[data-add]').forEach(btn=>{
      btn.onclick = ()=>{
        const group = findGroup(ys, btn.dataset.add, btn.dataset.group);
        group.rows.push(mkRow('Yeni Kategori'));
        const newIdx = group.rows.length-1;
        scheduleSave();
        render();
        const sel = 'tr[data-type="'+btn.dataset.add+'"][data-group="'+btn.dataset.group+'"][data-idx="'+newIdx+'"]';
        const newRow = document.querySelector(sel);
        if(newRow){
          setTimeout(()=>{
            scrollFieldIntoTopView(newRow);
            newRow.classList.add('row-highlight');
            setTimeout(()=>{ newRow.classList.remove('row-highlight'); }, 2200);
          }, 50);
        }
      };
    });

    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = ()=>{
        const type = btn.dataset.del, idx = parseInt(btn.dataset.delidx,10);
        const group = findGroup(ys, type, btn.dataset.delgroup);
        group.rows.splice(idx,1);
        scheduleSave();
        render();
      };
    });
  }

  function renderReport(){
    const app = document.getElementById('app');
    const ys = yearState();
    const a = analyzeYear(ys);
    const now = new Date();
    const nowStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});

    let html = '';
    html += '<header><p class="eyebrow">Finansal Analiz</p><h1>Nakit Durumu Raporu — '+appData.currentYear+'</h1></header>';
    html += '<button class="back-btn" id="backToDashBtn">← Dashboard\'a Dön</button>';

    html += '<div class="report-doc">';
    html += '<p class="report-meta">Bu rapor, girilen bütçe ve gerçekleşen verilere dayanarak otomatik oluşturulmuştur · '+nowStr+'</p>';

    if(!a.hasData){
      html += '<div class="report-card">';
      html += '<h3>Henüz Gerçekleşen Veri Yok</h3>';
      html += '<p>'+appData.currentYear+' yılı için henüz hiçbir ayda "Gerçek" gelir/gider girilmemiş. Anlamlı bir analiz yapabilmem için en az bir ayın gerçekleşen rakamlarını ana ekrandan işlemen gerekiyor.</p>';
      html += '<p>Yine de planlanan bütçene göre genel görünüm şöyle: yıllık toplam bütçelenen gelir <b>'+fmt(a.yearIncB)+' ₺</b>, toplam bütçelenen gider <b>'+fmt(a.yearExpB)+' ₺</b>, planlanan yıllık net <b>'+fmt(a.yearNetB)+' ₺</b>. Başlangıç devir bakiyen <b>'+fmt(a.startBalance)+' ₺</b>.</p>';
      html += '</div>';
      html += '</div>';
      app.innerHTML = html;
      attachReportHandlers(null);
      return;
    }

    const lastMonthName = MONTHS_FULL[a.lastActive];

    // 1. Genel durum
    html += '<div class="report-card">';
    html += '<h3>Genel Durum</h3>';
    html += '<p>'+appData.currentYear+' yılında Ocak\'tan '+lastMonthName+' ayına kadar ('+a.activeCount+' aylık) girilen gerçekleşen verilere göre toplam <b>'+fmt(a.incA)+' ₺</b> gelir elde edildi, <b>'+fmt(a.expA)+' ₺</b> gider gerçekleşti. Bu dönemin net nakit akışı '+(a.netA>=0?'pozitif':'negatif')+' yönde <b>'+fmt(Math.abs(a.netA))+' ₺</b> oldu. '+lastMonthName+' ayı sonu itibarıyla eldeki (devreden) nakit bakiyeniz yaklaşık <b>'+fmt(a.currentDevir)+' ₺</b>.</p>';
    html += '</div>';

    // 2. Gelir analizi
    html += '<div class="report-card">';
    html += '<h3>Gelir Analizi</h3>';
    let gelirP = 'Bu döneme kadar bütçelenen gelir <b>'+fmt(a.incB)+' ₺</b> iken, gerçekleşen gelir <b>'+fmt(a.incA)+' ₺</b> oldu.';
    if(a.incSapma !== null){
      if(a.incSapma >= 0){
        gelirP += ' Gerçekleşen gelir, bütçelenenin yaklaşık %'+fmt(Math.abs(a.incSapma))+' üzerinde — bu olumlu bir tablo, gelir tarafı planlanandan güçlü ilerliyor.';
      } else if(a.incSapma > -10){
        gelirP += ' Gerçekleşen gelir, bütçelenenin yaklaşık %'+fmt(Math.abs(a.incSapma))+' altında kaldı; küçük bir sapma, yakından takip etmekte fayda var.';
      } else {
        gelirP += ' Gerçekleşen gelir, bütçelenenin yaklaşık %'+fmt(Math.abs(a.incSapma))+' altında kaldı; bu belirgin bir gelir açığı, kaynağının ne olduğunu incelemek gerekir.';
      }
    }
    html += '<p>'+gelirP+'</p>';
    html += '</div>';

    // 3. Gider analizi
    html += '<div class="report-card'+(a.krediOran>40?' warn':'')+'">';
    html += '<h3>Gider Analizi</h3>';
    let giderP = 'Bu döneme kadar bütçelenen gider <b>'+fmt(a.expB)+' ₺</b>, gerçekleşen gider <b>'+fmt(a.expA)+' ₺</b> oldu';
    if(a.expSapma !== null){
      if(a.expSapma <= 0){
        giderP += ' — bütçenin yaklaşık %'+fmt(Math.abs(a.expSapma))+' altında kalınarak gider disiplini korunmuş.';
      } else if(a.expSapma < 15){
        giderP += ' — bütçenin yaklaşık %'+fmt(a.expSapma)+' üzerinde, hafif bir aşım var.';
      } else {
        giderP += ' — bütçenin yaklaşık %'+fmt(a.expSapma)+' üzerinde, belirgin bir bütçe aşımı söz konusu.';
      }
    }
    html += '<p>'+giderP+'</p>';
    let breakdownP = a.groupToDate.map(function(g){ return g.name+': <b>'+fmt(g.actual)+' ₺</b>'; }).join(', ');
    html += '<p>Kırılım olarak: '+breakdownP+'.</p>';
    if(a.krediOran > 40){
      html += '<p>Kredi kartı harcamaları toplam giderin yaklaşık <b>%'+fmt(a.krediOran)+'</b>\'ini oluşturuyor — bu oran dikkat çekici düzeyde yüksek ve faiz/gecikme maliyeti riski taşıyor.</p>';
    } else if(a.krediOran > 20){
      html += '<p>Kredi kartı harcamaları toplam giderin yaklaşık <b>%'+fmt(a.krediOran)+'</b>\'ini oluşturuyor — orta düzeyde, yakından izlenmesi faydalı olur.</p>';
    } else if(a.krediOran > 0){
      html += '<p>Kredi kartı harcamaları toplam giderin yalnızca yaklaşık <b>%'+fmt(a.krediOran)+'</b>\'i düzeyinde — sınırlı ve sağlıklı bir görünüm.</p>';
    }
    html += '</div>';

    // 4. Nakit pozisyonu ve trend
    html += '<div class="report-card">';
    html += '<h3>Nakit Pozisyonu ve Trend</h3>';
    let trendP = 'Son '+a.recentCount+' ayın ortalama net nakit akışı <b>'+fmt(a.recentAvg)+' ₺</b>, yıl genelindeki ortalama ise <b>'+fmt(a.avgNet)+' ₺</b>.';
    if(a.recentAvg < a.avgNet - Math.abs(a.avgNet*0.1)){
      trendP += ' Son dönemde nakit üretme gücünüzde bir yavaşlama görülüyor.';
    } else if(a.recentAvg > a.avgNet + Math.abs(a.avgNet*0.1)){
      trendP += ' Son dönemde nakit üretme performansınız güçleniyor, olumlu bir ivme var.';
    } else {
      trendP += ' Genel olarak istikrarlı bir seyir izliyor.';
    }
    html += '<p>'+trendP+'</p>';
    html += '</div>';

    // 5. Öngörü
    const riskFlag_trend = a.monthsToNegative && a.monthsToNegative<=a.remainingMonths;
    const riskFlag_budget = a.monthsToNegative_budget !== null;
    html += '<div class="report-card'+((riskFlag_trend||riskFlag_budget)?' warn':'')+'">';
    html += '<h3>Yıl Sonu Nakdim — Ne Kalır?</h3>';
    if(a.remainingMonths > 0){
      html += '<p>Şu anda ('+lastMonthName+' sonu itibarıyla) elinizde <b>'+fmt(a.currentDevir)+' ₺</b> var. Kalan '+a.remainingMonths+' ay için girdiğiniz bütçe planı aynen gerçekleşirse, '+appData.currentYear+' yılı sonunda elinizde yaklaşık <b style="font-size:1.15em;">'+fmt(a.projectedYearEnd_budget)+' ₺</b> kalır. (Bu rakam, ana ekrandaki ve Dashboard\'daki "Ay Sonu Nakdim" satırıyla birebir aynıdır.)</p>';

      if(riskFlag_budget){
        html += '<p>Girdiğiniz bütçe planına göre, yaklaşık <b>'+a.monthsToNegative_budget+' ay sonra ('+MONTHS_FULL[a.lastActive+a.monthsToNegative_budget]+')</b> nakit bakiyenizin eksiye dönmesi bekleniyor. Bu, önceden bir kredi limiti veya ek finansman ayarlamanız gerekebileceği anlamına gelir.</p>';
      }

      html += '<p style="color:var(--ink-faint); font-size:12px;">Alternatif bir bakış: bütçe planını hiç dikkate almadan, sadece son '+a.recentCount+' ayın ortalama performansı ('+fmt(a.recentAvg)+' ₺/ay) aynen devam etseydi, yıl sonu yaklaşık <b>'+fmt(a.projectedYearEnd)+' ₺</b> olurdu. Bu sadece geçmişe bakan kaba bir tahmindir, bütçe planınızı içermez — yukarıdaki bütçe bazlı rakam daha güvenilirdir.</p>';

      if(riskFlag_trend && !riskFlag_budget){
        html += '<p>Not: Sadece geçmiş performansa bakılırsa yaklaşık '+a.monthsToNegative+' ay içinde nakit sıkışıklığı riski görünüyor, ama bütçe planınıza göre bu risk şu an için düşük — planınıza sadık kalmaya devam edin.</p>';
      }
    } else {
      html += '<p>Yılın tüm ayları için veri girilmiş durumda, ek bir projeksiyona gerek yok. '+appData.currentYear+' yılı fiilen <b>'+fmt(a.currentDevir)+' ₺</b> devreden bakiye ile tamamlandı.</p>';
    }
    html += '</div>';

    // 6. Öneriler
    const recs = [];
    if(a.netA < 0){
      recs.push('Genel nakit akışınız bu dönemde negatif seyrediyor; gider kalemlerini gözden geçirmek veya ek bir gelir kaynağı yaratmak öncelikli olmalı.');
    }
    if(a.krediOran > 40){
      recs.push('Kredi kartı bağımlılığını azaltmak için sabit giderleri mümkün olduğunca nakit/banka üzerinden karşılamayı ve kart borcunu döndürmeden kapatmayı hedefleyin.');
    }
    if((a.monthsToNegative && a.monthsToNegative<=a.remainingMonths) || a.monthsToNegative_budget !== null){
      recs.push('Öngörülen nakit sıkışıklığına karşı, ihtiyaç doğmadan önce bir kredi limiti veya finansman kaynağı araştırmanız, ani nakit sıkıntısı yaşamamanız açısından önerilir.');
    }
    if(a.expSapma !== null && a.expSapma >= 15){
      recs.push('Gider tarafında bütçe aşımı belirgin; hangi kategorilerin bütçeyi aştığını ana ekrandaki Fark sütunlarından inceleyip önceliklendirme yapabilirsiniz.');
    }
    if(a.projectionDivergence !== null && a.projectionDivergence > 25){
      recs.push('Trend ile bütçe planı arasındaki fark büyük; kalan aylar için girdiğiniz bütçe rakamlarını güncel gerçeklere göre yeniden gözden geçirmeniz öngörünün güvenilirliğini artırır.');
    }
    if(recs.length === 0){
      recs.push('Genel tablo sağlıklı görünüyor: gelir gider dengesi olumlu, kredi kartı kullanımı sınırlı. Bu performansı korursanız birikim yapmayı veya küçük bir yatırımı değerlendirmeyi düşünebilirsiniz.');
    }
    html += '<div class="report-card rec">';
    html += '<h3>Öneriler</h3>';
    html += '<ul>' + recs.map(function(r){ return '<li>'+r+'</li>'; }).join('') + '</ul>';
    html += '</div>';

    html += '<div class="report-actions"><button class="backup-btn" id="copyReportBtn">📋 Raporu Kopyala</button></div>';

    html += '</div>';
    app.innerHTML = html;
    attachReportHandlers(a);
  }

  function attachReportHandlers(a){
    document.getElementById('backToDashBtn').onclick = ()=>{ viewMode='dashboard'; render(); };
    const copyBtn = document.getElementById('copyReportBtn');
    if(copyBtn){
      copyBtn.onclick = ()=>{
        const text = document.querySelector('.report-doc').innerText;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){
            const orig = copyBtn.textContent;
            copyBtn.textContent = '✓ Kopyalandı';
            setTimeout(function(){ copyBtn.textContent = orig; }, 1400);
          }).catch(function(){ alert('Kopyalama başarısız oldu.'); });
        } else {
          alert('Bu tarayıcı otomatik kopyalamayı desteklemiyor. Metni elle seçip kopyalayabilirsin.');
        }
      };
    }
  }

  // ---------------- Dashboard: category x month blended çarşaf report (side-by-side) ----------------
  function blendedRowValues(r, relevantMonthIdx){
    return r.months.map((m,i)=> (i<=relevantMonthIdx) ? parseTRNumber(m.actual) : parseTRNumber(m.budget));
  }

  function sheetRow(label, values, isGider, isFuture12){
    let html = '<tr class="'+(isGider?'gider-row':'gelir-row')+'"><td class="sticky-col"><div class="sticky-col-inner" style="padding-left:12px;">'+escapeAttr(label)+'</div></td>';
    let total = 0;
    values.forEach((v,i)=>{
      const disp = isGider ? -v : v;
      total += v;
      const cls = isFuture12[i] ? ' sheet-future' : '';
      html += '<td class="sheet-cell'+cls+'">'+fmt(disp)+'</td>';
    });
    const totalDisp = isGider ? -total : total;
    html += '<td class="readonly-cell '+(isGider?'gider-c':'gelir-c')+'">'+fmt(totalDisp)+'</td></tr>';
    return html;
  }

  function sheetTotalRow(label, values, isGider, isFuture12, cls){
    let html = '<tr class="total-row"><td class="sticky-col">'+label+'</td>';
    let total = 0;
    values.forEach((v,i)=>{
      const disp = isGider ? -v : v;
      total += v;
      const fcls = isFuture12[i] ? ' sheet-future' : '';
      html += '<td class="readonly-cell '+cls+fcls+'">'+fmt(disp)+'</td>';
    });
    const totalDisp = isGider ? -total : total;
    html += '<td class="readonly-cell '+cls+'">'+fmt(totalDisp)+'</td></tr>';
    return html;
  }

  function sheetNetRow(netVals, isFuture12){
    let html = '<tr class="net-row"><td class="sticky-col">NET AKIŞ</td>';
    let total = 0;
    netVals.forEach((v,i)=>{
      total += v;
      const fcls = isFuture12[i] ? ' sheet-future' : '';
      html += '<td class="readonly-cell'+fcls+'">'+(v>=0?'+':'')+fmt(v)+'</td>';
    });
    html += '<td class="readonly-cell">'+(total>=0?'+':'')+fmt(total)+'</td></tr>';
    return html;
  }

  function sheetCashRow(blended, isFuture12){
    let html = '<tr class="blend-row"><td class="sticky-col">ELDE KALAN NAKİT</td>';
    blended.forEach((v,i)=>{
      const tag = isFuture12[i] ? ' <span class="blend-tag">tahmini</span>' : '';
      html += '<td class="readonly-cell blend-cell'+(isFuture12[i]?' blend-future':'')+'">'+(v>=0?'+':'')+fmt(v)+tag+'</td>';
    });
    html += '<td class="readonly-cell blend-cell">'+(blended[11]>=0?'+':'')+fmt(blended[11])+'</td></tr>';
    return html;
  }

  function renderDashSheet(){
    const app = document.getElementById('app');
    const ys = yearState();
    const t = computeTotals(ys);
    const blendedInfo = computeBlendedCash(ys, t);
    const relevantMonthIdx = blendedInfo.relevantMonthIdx;
    const isFuture12 = [];
    for(let i=0;i<12;i++) isFuture12.push(i>relevantMonthIdx);

    let html = '';
    html += '<header><p class="eyebrow">Dashboard</p><h1>Kalem Bazlı Aylık Çarşaf</h1><p class="hint">Dashboard\'daki Kalem tablosuyla aynı satırlar (Genel Gelir, Krediler, Nakit Giderler, Kredi Kartı...), tek farkla: burada her ay yan yana. Her hücrede tek rakam — gerçekleşen ay varsa gerçek, yoksa bütçe. En dipte, aydan aya toplana toplana giden "Elde Kalan Nakit" var.</p></header>';
    html += '<button class="back-btn" id="backToDashFromSheetBtn">← Dashboard\'a Dön</button>';

    html += '<div class="swipe-note">→ Tüm ayları görmek için tabloyu yana kaydırın. Açık/italik hücreler henüz gelmemiş (bütçeden alınan) aylardır.</div>';

    html += '<div class="grid-wrap"><table>';
    html += '<thead><tr class="month-header"><th class="sticky-col">Kalem</th>';
    MONTHS.forEach((m,i)=> html += '<th'+(isFuture12[i]?' style="color:var(--gold-dim);"':'')+'>'+m+'</th>');
    html += '<th>Yıllık<br>Toplam</th></tr></thead><tbody>';

    html += '<tr class="section-row"><td class="sticky-col" colspan="14">GELİR</td></tr>';
    const gelirTotals = new Array(12).fill(0);
    ys.gelirGroups.forEach(group=>{
      const gGroupTotals = new Array(12).fill(0);
      group.rows.forEach(r=>{
        const vals = blendedRowValues(r, relevantMonthIdx);
        vals.forEach((v,i)=>{ gGroupTotals[i]+=v; gelirTotals[i]+=v; });
      });
      html += sheetTotalRow(group.name, gGroupTotals, false, isFuture12, 'gelir-c');
    });
    html += sheetTotalRow('TOPLAM GELİR', gelirTotals, false, isFuture12, 'gelir-c');

    html += '<tr class="section-row"><td class="sticky-col" colspan="14">GİDER</td></tr>';
    const giderTotals = new Array(12).fill(0);
    ys.giderGroups.forEach(group=>{
      const groupTotals = new Array(12).fill(0);
      group.rows.forEach(r=>{
        const vals = blendedRowValues(r, relevantMonthIdx);
        vals.forEach((v,i)=>{ groupTotals[i]+=v; giderTotals[i]+=v; });
      });
      html += sheetTotalRow(group.name, groupTotals, true, isFuture12, 'gider-c');
    });
    html += sheetTotalRow('TOPLAM GİDER', giderTotals, true, isFuture12, 'gider-c');

    const netVals = gelirTotals.map((g,i)=> g - giderTotals[i]);
    html += sheetNetRow(netVals, isFuture12);
    html += sheetCashRow(blendedInfo.blended, isFuture12);

    html += '</tbody></table></div>';

    app.innerHTML = html;
    document.getElementById('backToDashFromSheetBtn').onclick = ()=>{ viewMode='dashboard'; render(); };
  }

  function attachDashboardHandlers(){
    document.getElementById('backBtn').onclick = ()=>{ viewMode='main'; render(); };
    document.getElementById('openReportBtn').onclick = ()=>{ viewMode='report'; render(); };
    document.getElementById('openSheetBtn').onclick = ()=>{ viewMode='dashsheet'; render(); };
    document.getElementById('rangeStart').onchange = (e)=>{ dashRange.start = parseInt(e.target.value,10); if(dashRange.start>dashRange.end) dashRange.end=dashRange.start; render(); };
    document.getElementById('rangeEnd').onchange = (e)=>{ dashRange.end = parseInt(e.target.value,10); if(dashRange.end<dashRange.start) dashRange.start=dashRange.end; render(); };
    document.getElementById('bankMonthSelect').onchange = (e)=>{ dashBankMonth = parseInt(e.target.value,10); render(); };
    document.getElementById('bankBalInput').onchange = (e)=>{
      const ys = yearState();
      if(!ys.bankCheck) ys.bankCheck = {};
      const v = e.target.value.trim();
      if(v === ''){ delete ys.bankCheck[dashBankMonth]; }
      else{ ys.bankCheck[dashBankMonth] = parseTRNumber(v); }
      scheduleSave();
      render();
    };
  }

  // ---------------- Main screen handlers ----------------
  function attachHandlers(){
    const ys = yearState();

    document.getElementById('openDashBtn').onclick = ()=>{ viewMode='dashboard'; render(); };
    document.getElementById('openMonthBtn').onclick = ()=>{ viewMode='monthscreen'; render(); };

    document.querySelectorAll('.year-chip').forEach(chip=>{
      chip.onclick = ()=>{
        appData.currentYear = parseInt(chip.dataset.year,10);
        scheduleSave();
        render();
      };
    });

    document.getElementById('addYearBtn').onclick = ()=>{
      const years = Object.keys(appData.years).map(y=>parseInt(y,10));
      const maxYear = Math.max.apply(null, years);
      const newYear = maxYear + 1;
      if(appData.years[newYear]){ appData.currentYear = newYear; render(); return; }
      const srcYs = appData.years[maxYear];
      const t = computeTotals(srcYs);
      const newYs = {
        startBalance: t.devir[t.devir.length-1] || 0,
        bankCheck: {},
        gelirGroups: srcYs.gelirGroups.map(g=> ({ id:g.id, name:g.name, rows: g.rows.map(r=> mkRow(r.name)) })),
        giderGroups: srcYs.giderGroups.map(g=> ({ id:g.id, name:g.name, rows: g.rows.map(r=> mkRow(r.name)) }))
      };
      appData.years[newYear] = newYs;
      appData.currentYear = newYear;
      scheduleSave();
      render();
    };

    document.getElementById('startBalInput').onchange = (e)=>{
      ys.startBalance = parseTRNumber(e.target.value);
      scheduleSave();
      render();
    };

    document.getElementById('mainCashMonthSelect').onchange = (e)=>{
      mainCashMonth = parseInt(e.target.value,10);
      render();
    };

    attachBackupBar();
  }

  let currentFocusedInput = null;

  function scrollFieldIntoTopView(el){
    try{
      el.scrollIntoView(true); // legacy boolean form: align to top — works in virtually every WebView
    }catch(e){
      try{ el.scrollIntoView({block:'start'}); }catch(e2){}
    }
  }

  function keepFocusedVisible(){
    const el = currentFocusedInput;
    if(!el || !document.body.contains(el)) return;
    scrollFieldIntoTopView(el);
  }

  document.addEventListener('focusin', function(e){
    if(e.target && e.target.tagName === 'INPUT' && e.target.closest('#app')){
      currentFocusedInput = e.target;
      setTimeout(keepFocusedVisible, 50);
      setTimeout(keepFocusedVisible, 250);
      setTimeout(keepFocusedVisible, 500);
      setTimeout(keepFocusedVisible, 800);
      setTimeout(keepFocusedVisible, 1200);
    }
  });
  document.addEventListener('focusout', function(e){
    if(e.target === currentFocusedInput) currentFocusedInput = null;
  });
  document.addEventListener('input', function(e){
    if(e.target && e.target.tagName === 'INPUT' && e.target.closest('#app')){
      currentFocusedInput = e.target;
      keepFocusedVisible();
    }
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){
      setTimeout(keepFocusedVisible, 50);
      setTimeout(keepFocusedVisible, 300);
      setTimeout(keepFocusedVisible, 600);
    });
  }

  loadData();
})();
</script>
</body>
</html>
